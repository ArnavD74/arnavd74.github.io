<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Arnav Dashaputra - Data Scientist & Full-Stack Engineer. Building elegant solutions with React, TypeScript, and cloud technologies." />
    <meta name="author" content="Arnav Dashaputra" />
    <meta name="theme-color" content="#08090c" />
    <meta name="color-scheme" content="dark" />

    <!-- Open Graph / social previews. Absolute URLs are required here: scrapers
         do not resolve root-relative paths against the page. -->
    <meta property="og:title" content="Arnav Dashaputra | Data Scientist & Full-Stack Engineer" />
    <meta property="og:description" content="Data Scientist & Full-Stack Engineer specializing in React, TypeScript, Python, and cloud architecture." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Arnav Dashaputra" />
    <meta property="og:url" content="https://dashaputra.net/" />
    <meta property="og:image" content="https://dashaputra.net/images/pfp2.png" />
    <meta property="og:image:alt" content="Arnav Dashaputra" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Arnav Dashaputra | Data Scientist & Full-Stack Engineer" />
    <meta name="twitter:description" content="Data Scientist & Full-Stack Engineer specializing in React, TypeScript, Python, and cloud architecture." />
    <meta name="twitter:image" content="https://dashaputra.net/images/pfp2.png" />

    <!-- The Content-Security-Policy meta tag is injected at build time (see
         vite.config.ts). It must use http-equiv rather than name to take effect,
         and the dev server needs looser rules than the built site. -->
    <link rel="canonical" href="https://dashaputra.net/" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://api.fontshare.com" />
    <!-- Fontshare's stylesheet lives on api.*, but the font files it pulls are on
         cdn.* — without this the second connection is only opened after the CSS
         has already parsed. -->
    <link rel="preconnect" href="https://cdn.fontshare.com" crossorigin />
    <!-- NOTE: the f[0]/f[1] indices are load-bearing. With repeated bare `f[]`
         params Fontshare's API silently honours only the FIRST one and drops the
         rest, so the previous `f[]=clash-display...&f[]=satoshi...` returned no
         Satoshi at all and every `font-body` element fell back to system-ui. -->
    <link href="https://api.fontshare.com/v2/css?f[0]=clash-display@400,500,600,700&f[1]=satoshi@400,500,700&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <!-- Two glyphs of Quicksand, for the ":]" in the About copy and nothing else
         (see --font-emoticon). `text=` subsets the face server-side, so this is a
         ~1KB woff2 with a unicode-range of U+3A,U+5D; it cannot leak into any
         other text even if the family name is applied more widely. It needs its
         own <link> because `text=` scopes the whole request, so it cannot be
         folded into the JetBrains Mono one above. -->
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500&text=%3A%5D&display=swap" rel="stylesheet" />
    <title>Arnav Dashaputra | Portfolio</title>

    <!-- Styles for the no-JS fallback below. A <noscript> in <head> may only
         contain link/style/meta, which is exactly what this is; the matching
         content lives in <body>. Browsers with JS on never parse either. -->
    <noscript>
      <style>
        /* Keep in sync with public/noscript/index.html, which serves this same
           markup at /noscript/ so it can be previewed without disabling JS. */
        .ns {
          min-height: 100dvh;
          display: flex;
          align-items: center;
          justify-content: center;
          padding: 2rem;
          background: #08090c;
          color: #e8ecf2;
          font-family: 'Satoshi', system-ui, sans-serif;
          box-sizing: border-box;
        }
        .ns *, .ns *::before, .ns *::after { margin: 0; padding: 0; box-sizing: border-box; }
        .ns-inner { max-width: 32rem; width: 100%; }
        .ns-eyebrow {
          font-family: 'JetBrains Mono', monospace;
          font-size: 0.75rem;
          letter-spacing: 0.2em;
          text-transform: uppercase;
          color: #00d4ff;
          display: flex;
          align-items: center;
          gap: 1rem;
          margin-bottom: 1.5rem;
        }
        .ns-eyebrow::after { content: ''; flex: 1; height: 1px; background: #1a1e27; }
        .ns h1 {
          font-family: 'Clash Display', system-ui, sans-serif;
          font-weight: 700;
          font-size: clamp(2.25rem, 7vw, 3.5rem);
          line-height: 1.05;
          letter-spacing: -0.02em;
          color: #fff;
          margin-bottom: 0.5rem;
        }
        .ns-role { color: #8994a8; font-size: 1.05rem; margin-bottom: 2rem; }
        .ns-note {
          border-left: 2px solid #00d4ff;
          padding-left: 1rem;
          color: #c4cdd9;
          font-size: 0.95rem;
          line-height: 1.6;
          margin-bottom: 2rem;
        }
        .ns-links { list-style: none; display: flex; flex-direction: column; gap: 0.75rem; }
        .ns-links a {
          font-family: 'JetBrains Mono', monospace;
          font-size: 0.9rem;
          color: #e8ecf2;
          text-decoration: none;
          border-bottom: 1px solid #3d4556;
          padding-bottom: 2px;
        }
        /* min-width:0 lets a long value shrink inside the flex row instead of
           pushing past the viewport on a narrow screen. */
        .ns-links a { min-width: 0; overflow-wrap: anywhere; }
        .ns-links a:hover, .ns-links a:focus-visible { color: #00d4ff; border-color: #00d4ff; }
        /* Fixed width rather than padding the label with spaces, so the values
           line up in a column regardless of key length. */
        .ns-links li { display: flex; align-items: baseline; gap: 0.75rem; }
        .ns-links .ns-key {
          color: #5a6478;
          font-family: 'JetBrains Mono', monospace;
          font-size: 0.8rem;
          flex: 0 0 4.5rem;
        }
      </style>
    </noscript>
  </head>
  <body>
    <div id="root"></div>

    <noscript>
      <div class="ns">
        <div class="ns-inner">
          <p class="ns-eyebrow">No JavaScript</p>
          <h1>Arnav Dashaputra</h1>
          <p class="ns-role">Data Scientist &amp; Full-Stack Engineer</p>
          <p class="ns-note">
            The full portfolio is interactive and needs JavaScript enabled. Here are
            the essentials in the meantime.
          </p>
          <ul class="ns-links">
            <li><span class="ns-key">email</span><a href="mailto:arnav@dashaputra.net">arnav@dashaputra.net</a></li>
            <li><span class="ns-key">github</span><a href="https://github.com/ArnavD74">github.com/ArnavD74</a></li>
            <li><span class="ns-key">linkedin</span><a href="https://linkedin.com/in/dashaputra">linkedin.com/in/dashaputra</a></li>
            <li><span class="ns-key">resume</span><a href="/ArnavDashaputra_Resume2026.pdf">Resume 2026 (PDF)</a></li>
          </ul>
        </div>
      </div>
    </noscript>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
